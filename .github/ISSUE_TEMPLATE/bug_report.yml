name: Bug 报告
description: 使用 Bismuth 时遇到的错误或异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索是否已有同类 issue，避免重复提交。
        - Web 端问题请附浏览器控制台（F12 → Console）里的报错。注意正式构建会剥掉 `console.log` / `console.debug`，只保留 error 与 warn，所以别盯着日志找不到就以为没报错——红色报错才是我们要的。
        - 若问题只出现在某个影视源上，请改用「播放源问题」模板。
        - 9.8.3 起精简版（`Bismuth_x.y.z.apk`）换了签名，只能卸载重装。若你刚卸载重装、发现历史和收藏没了，这属于卸载清数据的正常结果，不是 bug；影视源列表可以用更新前「导出」的 json 通过「导入」找回来。

        > 安全漏洞请勿在此公开报告。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 在「设置 → 关于」中可查看当前版本
      placeholder: 例如 9.8.3
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 安卓版两个包的区别：精简版文件名不带后缀，CORS 版文件名带 `_CORS`
      options:
        - Android APK（精简版）
        - Android APK（CORS 版）
        - Web 浏览器
        - Windows 桌面壳（Bismuth Desktop）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: update_method
    attributes:
      label: 这次是怎么装上的
      description: 覆盖升级与卸载重装的数据状态不同，排查时差别很大
      options:
        - 全新安装（之前没装过）
        - 从旧版本直接覆盖升级
        - 卸载旧版后重装（数据已清空）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: cors
    attributes:
      label: CORS 代理状态
      description: 当前如何解决跨域？
      options:
        - 使用内置 CORS 代理
        - 填了自定义代理地址
        - 已关闭 CORS 代理
        - 不确定
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: 使用的播放源（可选）
      description: 如果问题与特定源有关，请填写源 API 地址
      placeholder: https://example.com/api.php/provide/vod
    validations:
      required: false

  - type: dropdown
    id: local_source
    attributes:
      label: 源地址是否本地或内网
      description: 9.8.1 起，localhost / 127.x / 192.168.x 等本地或内网地址不走 CORS 代理
      options:
        - 是，本地或内网地址（如 127.0.0.1、192.168.x.x）
        - 否，公网地址
        - 不确定
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统版本（可选）
      description: 安卓版建议填写，播放器相关的问题常和机型、系统有关
      placeholder: 例如 小米 14 / Android 15
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？请把现象描述清楚
      placeholder: 例如：进入详情页后点击播放没有反应……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步写出如何触发这个问题
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / 录屏 / 控制台报错（可选）
      description: 直接把图片拖进这个编辑框即可上传，也可以粘贴报错文字
      placeholder: 把截图拖到这里，或直接粘贴、附上链接
    validations:
      required: false
