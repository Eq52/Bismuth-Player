name: Bug 报告
description: 使用 Bismuth 时遇到的错误或异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索是否已有同类 issue，避免重复提交。
        - Web 端问题请附浏览器控制台（F12 → Console）的报错信息。
        - 若问题只出现在某个影视源上，请改用「播放源问题」模板。

        > 安全漏洞请勿在此公开报告。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 在「设置 → 关于」中可查看当前版本
      placeholder: 例如 9.8.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android APK（CORS 版）
        - Android APK（普通版）
        - Web 浏览器
        - Windows 桌面壳（Bismuth Desktop）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: cors
    attributes:
      label: CORS 代理状态
      description: 当前如何解决跨域？
      options:
        - 使用内置 CORS 代理
        - 填了自定义代理地址
        - 已关闭 CORS 代理
        - 不确定
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: 使用的播放源（可选）
      description: 如果问题与特定源有关，请填写源 API 地址
      placeholder: https://example.com/api.php/provide/vod
    validations:
      required: false

  - type: dropdown
    id: local_source
    attributes:
      label: 源地址是否本地或内网
      description: 9.8.1 起，localhost / 127.x / 192.168.x 等本地或内网地址不走 CORS 代理
      options:
        - 是，本地或内网地址（如 127.0.0.1、192.168.x.x）
        - 否，公网地址
        - 不确定
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？请把现象描述清楚
      placeholder: 例如：进入详情页后点击播放没有反应……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步写出如何触发这个问题
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / 录屏 / 控制台报错（可选）
      description: 直接把图片拖进这个编辑框即可上传，也可以粘贴报错文字
      placeholder: 把截图拖到这里，或直接粘贴、附上链接
    validations:
      required: false
